<!-- Social share card (1200x630). Editable source.
     NOTE: X/Twitter & some scrapers don't render SVG OG images. For universal
     support, export this to assets/og-image.png (1200x630) and point the
     og:image / twitter:image meta tags at the .png. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(250 120) rotate(40) scale(720 520)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".30"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0c0c0e"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="8" y="8" width="1184" height="614" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- monogram tile -->
  <rect x="88" y="86" width="64" height="64" rx="15" fill="#141417" stroke="url(#grad)" stroke-opacity=".6"/>
  <path d="M104 134V100l16 16 16-16v34" fill="none" stroke="url(#grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="90" y="312" font-family="'Courier New', monospace" font-size="24" letter-spacing="6" fill="#a78bfa">FRONTEND DEVELOPER</text>
  <text x="84" y="430" font-size="130" font-weight="700" letter-spacing="-3" fill="#f0f0f2">Mohammed</text>
  <text x="90" y="498" font-family="Arial, sans-serif" font-size="30" fill="#a8a8b3">I build fast, accessible interfaces — design to production.</text>

  <line x1="90" y1="548" x2="1110" y2="548" stroke="#ffffff" stroke-opacity=".08"/>
  <circle cx="98" cy="582" r="5" fill="#34d399"/>
  <text x="116" y="588" font-family="'Courier New', monospace" font-size="20" fill="#76767f">Available for work · 2026</text>
  <text x="1110" y="588" text-anchor="end" font-family="'Courier New', monospace" font-size="20" fill="#76767f">yoursite.dev</text>
</svg>
